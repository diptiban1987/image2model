<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="cubeGradient" x1="50" y1="50" x2="206" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)"/>
  
  <!-- 3D Cube Icon -->
  <g transform="translate(128, 128) scale(0.7) translate(-128, -128)">
    <!-- Cube Front Face -->
    <polygon points="128,48 192,88 192,168 128,208 64,168 64,88" fill="url(#cubeGradient)" opacity="0.9"/>
    <!-- Cube Top Face -->
    <polygon points="128,48 192,88 128,108 64,88" fill="white" opacity="0.3"/>
    <!-- Cube Right Face -->
    <polygon points="192,88 192,168 128,208 128,108" fill="white" opacity="0.2"/>
  </g>
</svg>